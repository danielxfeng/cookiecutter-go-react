name: ci-frontend-start

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/frontend-start/**"
      - "packages/schemas/**"
      - ".github/workflows/ci-frontend-start.yml"

jobs:
  test-frontend-start:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-start

    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run pre-commit checks
        run: pnpm run precommit
